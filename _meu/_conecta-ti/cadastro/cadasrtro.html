<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style_cad.css">
</head>
<body>
  <div class="container">
    <form class="form" action="#" method="POST">
      <h2>Faça o seu cadastro</h2>
      <div class="input-box">
        <input type="text" name="nome" required>
        <label>Nome</label>
      </div>
      <div class="input-box">
        <input type="number" name="contacto" required>
        <label>Contacto</label>
      </div>
      <div class="input-box">
        <input type="email" name="email" required>
        <label>Email</label>
      </div>
      <div class="input-box">
        <input type="password" name="senha" required>
        <label>Senha</label>
      </div>
      <div class="input-box">
        <input type="password" name="senha_conf" required>
        <label>Confirmar a Senha</label>
      </div>

      
      <button type="submit"><span>Cadastrar</span></button>
    </form>
    <div class="links">
      <p> Já tenho conta! <a href="../Login/login.html">Logar</a></p>
      
    </div>
  </div>
</body>
</html>
