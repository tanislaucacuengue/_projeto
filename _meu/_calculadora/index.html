<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="jquery.js"></script>
    <title>Calculadora</title>
</head>
<body>
    
    <div class="contentor">
        <form name="calculadora">
            <input type="text" name="exibir">

            <input type="button" value="1" onclick="calculadora.exibir.value += '1' ">
            <input type="button" value="2" onclick="calculadora.exibir.value += '2' ">
            <input type="button" value="3" onclick="calculadora.exibir.value += '3' ">
            <input type="button" value="back" onclick="calculadora.exibir.value = exibir.value.slice(0, -1)">

            <input type="button" value="4" onclick="calculadora.exibir.value += '4' ">
            <input type="button" value="5" onclick="calculadora.exibir.value += '5' ">
            <input type="button" value="6" onclick="calculadora.exibir.value += '6' ">
            <input type="button" value="-" onclick="calculadora.exibir.value += '-' ">

            <input type="button" value="7" onclick="calculadora.exibir.value += '7' ">
            <input type="button" value="8" onclick="calculadora.exibir.value += '8' ">
            <input type="button" value="9" onclick="calculadora.exibir.value += '9' ">
            <input type="button" value="X" onclick="calculadora.exibir.value += '*' ">

            <input type="button" value="." onclick="calculadora.exibir.value += '.' ">
            <input type="button" value="0" onclick="calculadora.exibir.value += '0' ">
            <input type="button" value="/" onclick="calculadora.exibir.value += '/' ">
            <input type="button" value="+" onclick="calculadora.exibir.value += '+' ">
            <input type="button" value="limpar" onclick="calculadora.exibir.value = '' ">
            <input type="button" class="total" value="=" onclick="calculadora.exibir.value = eval(calculadora.exibir.value) ">
        </form>
    </div>
</body>
</html>
