<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style media="screen">
    body{
        height: 100vh;
        display: grid;
        place-items: center;
        background-color: yellow;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .principal{
        display: grid;  
        place-items: center;
        height: 600px;
        width: 400px;
        background-color: #fff;
        box-shadow: 0 0 10px #333;
        border-radius: 10px;
    }

    .principal #saida{
        height: 200px;
        width: 200px;
        background-color: #ff3300;
    }

    .principal #box{
        height: 30px;
        width: 300px;
        background-color: #333;
        color: #fff;
        border: none;
        outline: none;
        border-radius: 25px;
        text-align: center;
    }

    input[type = "range"]{
        -webkit-appearance: none;
        height: 15px;
        width: 80%;
        background-color: #333;
        outline: none;
        border-radius: 50px;
    }

    input[type = "range"]::-webkit-slider-thumb{
        -webkit-appearance: none;
        height: 30px;
        width: 30px;
        background-color: #ff3300;
        outline: none;
        cursor: pointer;
        border-radius: 50%;
    }
</style>

<script defer src="jquery.js" charset="UTF-8"></script>

    <title>Gerador de Bordas de esfera </title>
</head>


<body>

    <div class="principal">
        
        Saída: <div id="saida"></div>

        Resul: <input type="text" id="box" value="border-radius: 0% 0% 0% 0%;">
        <input type="range" min="0" max="100" value="0" id="slider1">
        <input type="range" min="0" max="100" value="0" id="slider2">
        <input type="range" min="0" max="100" value="0" id="slider3">
        <input type="range" min="0" max="100" value="0" id="slider4">
    </div>

<script type="text/javascript">
    $(document).ready(function(){
            $('#slider1, #slider2, #slider3, #slider4').on('input',function(){
            

            var slider1 = $('#slider1').val();
            var slider2 = $('#slider2').val();
            var slider3 = $('#slider3').val();
            var slider4 = $('#slider4').val();

            $('#saida').css('border-top-right-radius', slider1 + '%');
            $('#saida').css('border-top-left-radius', slider2 + '%');
            $('#saida').css('border-bottom-right-radius', slider3 + '%');
            $('#saida').css('border-bottom-left-radius', slider4 + '%');
            $('#box').val('border-radius:'+slider1+'% '+slider2+'% '+slider3+'% '+slider4+'%;'); 


            
            });
         
         
         });
</script>
    
</body>
</html>
