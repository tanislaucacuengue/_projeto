<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">

    <title>Piano</title>
</head>
<body>

    <section class="piano">

        <section class="controles">

            <h1>Benjamim |Piano| Cacuengue</h1>

            <label class="verificar__label">
                Mostrar teclas
                <span class="interruptor">
                    <span class="btn-interruptor"></span>
                </span>
                <input type="checkbox" class="verificar__tecla" hidden>
            </label>

        </section>



        <section class="piano__teclas teclas--desactivadas">

            <div class="tecla white" data-nota="1"><span>TAB</span></div>
            <div class="tecla black" data-nota="2"><span>1</span></div>
            <div class="tecla white" data-nota="3"><span>Q</span></div>
            <div class="tecla black" data-nota="4"><span>2</span></div>
            <div class="tecla white" data-nota="5"><span>W</span></div>
            <div class="tecla white" data-nota="6"><span>E</span></div>
            <div class="tecla black" data-nota="7"><span>4</span></div>
            <div class="tecla white" data-nota="8"><span>R</span></div>
            <div class="tecla black" data-nota="9"><span>5</span></div>
            <div class="tecla white" data-nota="10"><span>T</span></div>
            <div class="tecla black" data-nota="11"><span>6</span></div>
            <div class="tecla white" data-nota="12"><span>Y</span></div>
            <div class="tecla white" data-nota="13"><span>U</span></div>
            <div class="tecla black" data-nota="14"><span>8</span></div>
            <div class="tecla white" data-nota="15"><span>I</span></div>
            <div class="tecla black" data-nota="16"><span>9</span></div>
            <div class="tecla white" data-nota="17"><span>O</span></div>
            <div class="tecla white" data-nota="18"><span>P</span></div>
            <div class="tecla black" data-nota="19"><span>-</span></div>
            <div class="tecla white" data-nota="20"><span>[</span></div>
            <div class="tecla black" data-nota="21"><span>=</span></div>
            <div class="tecla white" data-nota="22"><span>]</span></div>
            <div class="tecla black" data-nota="23"><span>&Larr;</span></div>
            <div class="tecla white" data-nota="24"><span>\</span></div>

        </section>

    </section>

    <script src="./js/script.js"></script>
</body>
</html>
