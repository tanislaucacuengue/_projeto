<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cores RGB</title>

    <style>
        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            padding: 0;
            display: grid;
            place-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
            'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell;
        }

        h1{
            text-align: center;
            font-size: 15pt;
        }

        .principal{
            height: 400px;
            width: 250px;
            background-color: #333;
            display: grid;
            place-items: center;
            color: #fff;
            border-radius: 5px;
            padding: 10px;
        }

        #box{
            height: 40px;
            width: 80%;
            border: none;
            outline: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        input[type="range"]{
            -webkit-appearance: none;
            height: 10px;
            width: 80%;
            border-radius: 50px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb{
            -webkit-appearance: none;
            height: 25px;
            width: 25px;
            border-radius: 50%;
            background-color: #fff;
            cursor: pointer;
        }

        #red{
            background: linear-gradient(90deg, #000, red);
        }

        #green{
            background: linear-gradient(90deg, #000, green);
        }

        #blue{
            background: linear-gradient(90deg, #000, blue);
        }
    </style>
</head>
<body>

    <div class="principal">
        <h1>Gerador de Cores RGB</h1>

        Resultado
        <input type="text" id="box" readonly>

        Vermelho
        <input type="range" id="red" min="0" max="255" value="255">

        Verde
        <input type="range" id="green" min="0" max="255" value="255">

        Azul
        <input type="range" id="blue" min="0" max="255" value="255">
    </div>

    <script>
        function minhaCor(){
            let red = document.getElementById('red').value;
            let green = document.getElementById('green').value;
            let blue = document.getElementById('blue').value;

            let cor = `rgb(${red}, ${green}, ${blue})`;

            document.body.style.backgroundColor = cor;
            document.getElementById('box').value = cor;
        }

        document.getElementById('red').addEventListener('input', minhaCor);
        document.getElementById('green').addEventListener('input', minhaCor);
        document.getElementById('blue').addEventListener('input', minhaCor);

        // aplica a cor logo ao carregar a página
        minhaCor();
    </script>

</body>
</html>
