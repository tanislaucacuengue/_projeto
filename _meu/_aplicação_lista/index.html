<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Lista de Tarefas</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            letter-spacing: 1px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-transform: capitalize;
        }

        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff0 50%, #333 50%);
        }

        .contentor{
            height: 450px;
            width: 330px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
            padding: 10px;
            overflow-y: auto;
        }

        #input{
            height: 50px;
            width: 100%;
            outline: none;
            border: none;
            border-radius: 5px;
            background: #666;
            color: #fff;
            padding: 0 10px;
            margin: 15px 0;
        }

        #input::placeholder{
            color: #fff;
        }

        ul{
            list-style: none;
        }

        ul li{
            background: #eee;
            border-radius: 50px;
            margin: 10px 0;
            padding: 10px 50px 10px 15px;
            position: relative;
        }

        ul .fa-check,
        ul .fa-trash{
            position: absolute;
            cursor: pointer;
            top: 50%;
            transform: translateY(-50%);
        }

        ul .fa-check{
            right: 40px;
            color: green;
        }

        ul .fa-trash{
            right: 15px;
            color: red;
        }

        ul .checked{
            background: lightgreen;
            text-decoration: line-through;
        }
    </style>
</head>
<body>

<div class="contentor">
    <input type="text" id="input" placeholder="Pressione Enter para adicionar tarefas">
    <ul></ul>
</div>

<script>
$(document).ready(function(){

    $('#input').on('keypress', function(e){
        if(e.which === 13 && $(this).val().trim() !== ''){
            let tarefa = $(this).val();

            $('ul').append(`
                <li>
                    ${tarefa}
                    <i class="fas fa-check"></i>
                    <i class="fas fa-trash"></i>
                </li>
            `);

            $(this).val('');
        }
    });

    $('ul').on('click', '.fa-trash', function(){
        $(this).parent('li').fadeOut(200, function(){
            $(this).remove();
        });
    });

    $('ul').on('click', '.fa-check', function(){
        $(this).parent('li').toggleClass('checked');
    });

});
</script>

</body>
</html>
